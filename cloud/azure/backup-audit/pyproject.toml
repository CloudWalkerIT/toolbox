[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-backup-audit"
version = "0.1.0"
description = "Audit Azure backup coverage across one or many subscriptions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CloudWalkerIT" }]
dependencies = [
  "azure-identity>=1.17",
  "azure-mgmt-resourcegraph>=8.0",
  "azure-mgmt-recoveryservicesbackup>=9.1",
  "azure-mgmt-recoveryservices>=3.0",
  "azure-mgmt-subscription>=3.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[project.scripts]
azure-backup-audit = "backup_audit.cli:main"

[tool.setuptools.packages.find]
include = ["backup_audit*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
